[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "n10w02"

version = "0.0.7"

description = "Python device control package for the Canon N10-W02 camera."
authors = [
  { name="Kengo NAKADA", email="kengo.nakada@email.com" }
]
readme = "README.md"
requires-python = ">=3.7"
#requires-python = ">=3.8"
#requires-python = ">=3.11"
dependencies = [
    #"x_logger",
    "xlogger-py",
    "ese774-frame",
    #
    "setuptools",
    "python-dotenv",
    "fastapi",
    "fastapi-utils",
    "uvicorn",
    "pydantic",
    "starlette",
    "requests",
    "aiohttp",
    "httpx",
    "pywin32; sys_platform == 'win32'",
    # "pygame; sys_platform == 'win32'",
    "coloredlogs",
    "colorlog",
    #
    "pytest",
    "pytest-asyncio",
    #
    # "pytango",
    #   "pyserial",
    #
    "pyyaml",
    "toml",
    "tomli; python_version < '3.11'",
     #
    "importlib-metadata>=4.0; python_version < '3.8'",
    #
    "nest_asyncio",
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py",
    #
    "grpcio",
    "grpcio-tools",
    "google",
    "pygame",
    #    "pyserial",
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/n10w02/"
Documentation = "https://ohara-lab-su.github.io/n10w02/"
Repository = "https://github.com/ohara-lab-su/n10w02"
Issues = "https://github.com/ohara-lab-su/n10w02/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"